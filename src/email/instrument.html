<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{{ subject }}</title>
  <!--
    NCode Brand [[version]]: email/instrument.html, an HTML email in the light theme with every value written inline,
    but for the key's and the screen's colors: slots the sending application fills from deriveBrand() of
    tokens/derive.mjs, NCode's own colors or a tenant's. Generated by build.mjs from src/email/instrument.html with the
    values of src/tokens.source.json: edit that file. Apache-2.0. The sending application fills each slot in double
    braces, escaped as HTML, as guidelines/12-applying.md says.
  -->
</head>
<body style="margin:0;padding:0;background-color:[[color:page]];">
  <div style="display:none;max-height:0;overflow:hidden;">{{ preheader }}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:[[color:page]];">
    <tr>
      <td align="center" style="padding:[[space:7]] [[space:5]];">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">
          <tr>
            <td style="padding:0 0 [[space:6]];">
              <img src="{{ logo_url }}" width="{{ logo_width }}" height="32" alt="{{ product }}" style="display:block;height:32px;border:0;">
            </td>
          </tr>
          <tr>
            <td style="padding:[[space:7]];background-color:[[color:surface-raised]];border:[[border:hair]] solid [[color:border]];border-radius:[[radius:module]];">
              <h1 style="margin:0 0 [[space:5]];[[type:heading]];color:[[color:text]];">{{ heading }}</h1>
              <p style="margin:0;[[type:body]];color:[[color:text]];">{{ message }}</p>
              <!-- The key: delete this table when the message asks for no action. -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:[[space:6]];">
                <tr>
                  <td style="background-color:{{ primary }};border:[[border:hair]] solid {{ primary_edge }};border-bottom:[[border:bold]] solid {{ primary_lip }};border-radius:[[radius:control]];">
                    <a href="{{ action_url }}" style="display:inline-block;padding:[[space:4]] [[space:6]];[[type:minor]];color:{{ on_primary }};text-decoration:none;">{{ action_label }}</a>
                  </td>
                </tr>
              </table>
              <!-- The code: a value read off the system, on a screen. Delete this table when the message carries none. -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:[[space:6]];">
                <tr>
                  <td style="padding:[[space:4]] [[space:6]];background-color:{{ screen }};border-radius:[[radius:panel]];[[face:value]];font-size:[[text:2xl]];color:{{ on_screen }};">{{ code }}</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:[[space:6]] [[space:7]] 0;[[type:ui]];color:[[color:text-muted]];">{{ footer }}</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
