<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{{ subject }}</title>
  <!--
    NCode Brand 0.9.0: email/instrument.html, an HTML email in the light theme with every value written inline,
    but for the key's and the screen's colors: slots the sending application fills from deriveBrand() of
    tokens/derive.mjs, NCode's own colors or a tenant's. Generated by build.mjs from src/email/instrument.html with the
    values of src/tokens.source.json: edit that file. Apache-2.0. The sending application fills each slot in double
    braces, escaped as HTML, as guidelines/12-applying.md says.
  -->
</head>
<body style="margin:0;padding:0;background-color:#E9E9E4;">
  <div style="display:none;max-height:0;overflow:hidden;">{{ preheader }}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#E9E9E4;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">
          <tr>
            <td style="padding:0 0 24px;">
              <img src="{{ logo_url }}" width="{{ logo_width }}" height="32" alt="{{ product }}" style="display:block;height:32px;border:0;">
            </td>
          </tr>
          <tr>
            <td style="padding:32px;background-color:#FFFFFF;border:1px solid #D9D9D4;border-radius:14px;">
              <h1 style="margin:0 0 16px;font-family:'Instrument Sans Variable','Instrument Sans',system-ui,-apple-system,'Segoe UI','Roboto','Helvetica Neue','Arial',sans-serif;font-size:28px;line-height:1.18;font-weight:600;letter-spacing:-0.012em;color:#171714;">{{ heading }}</h1>
              <p style="margin:0;font-family:'Instrument Sans Variable','Instrument Sans',system-ui,-apple-system,'Segoe UI','Roboto','Helvetica Neue','Arial',sans-serif;font-size:16px;line-height:1.5;font-weight:400;letter-spacing:0;color:#171714;">{{ message }}</p>
              <!-- The key: delete this table when the message asks for no action. -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:24px;">
                <tr>
                  <td style="background-color:{{ primary }};border:1px solid {{ primary_edge }};border-bottom:2px solid {{ primary_lip }};border-radius:6px;">
                    <a href="{{ action_url }}" style="display:inline-block;padding:12px 24px;font-family:'Instrument Sans Variable','Instrument Sans',system-ui,-apple-system,'Segoe UI','Roboto','Helvetica Neue','Arial',sans-serif;font-size:16px;line-height:1.3;font-weight:600;letter-spacing:0;color:{{ on_primary }};text-decoration:none;">{{ action_label }}</a>
                  </td>
                </tr>
              </table>
              <!-- The code: a value read off the system, on a screen. Delete this table when the message carries none. -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:24px;">
                <tr>
                  <td style="padding:12px 24px;background-color:{{ screen }};border-radius:10px;font-family:'Martian Mono Variable','Martian Mono',ui-monospace,'Cascadia Mono','SF Mono','Menlo','Consolas',monospace;line-height:1.4;font-weight:500;letter-spacing:-0.01em;font-size:28px;color:{{ on_screen }};">{{ code }}</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px 0;font-family:'Instrument Sans Variable','Instrument Sans',system-ui,-apple-system,'Segoe UI','Roboto','Helvetica Neue','Arial',sans-serif;font-size:14px;line-height:1.5;font-weight:400;letter-spacing:0;color:#5E5E58;">{{ footer }}</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
