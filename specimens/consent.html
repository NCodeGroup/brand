<p class="hazard" role="status">
  <span class="hazard__text">
    <svg class="icon" aria-hidden="true"><use href="#i-caution"/></svg>
    This is a test environment.
  </span>
</p>

<main class="auth__stage">
  <div class="auth__unit">

    <!-- The card is the tenant's scope, so it stands between the tenant's braces. -->
    <div class="auth__frame brace" data-scope="tenant">
      <section class="plate plate--raised auth__card" aria-labelledby="consent-title">
        <!-- The nameplate: the tenant's own logo goes here. -->
        <div class="auth__nameplate">
          <svg class="logo logo--identity" viewBox="0 0 371 64" role="img" aria-label="NCode Identity"><use href="#logo-identity"/></svg>
        </div>

        <form class="auth__form" method="post" action="consent.html">
          <h1 class="auth__title" id="consent-title">Authorize access</h1>
          <p class="auth__text"><strong>Contoso Portal</strong> is requesting access to your account. Choose what to allow:</p>

          <!-- Who is asking, and whose account it is. -->
          <div class="party">
            <span class="party__icon"><svg class="icon icon--lg" aria-hidden="true"><use href="#i-clients"/></svg></span>
            <span>
              <span class="party__name">Contoso Portal</span>
              <span class="party__id value"><span class="vh">Client ID </span>web-portal</span>
            </span>
            <span class="party__as">Signed in as <span class="value">alex@contoso.example</span></span>
          </div>

          <fieldset class="fieldset" data-testid="consent-scopes">
            <legend class="field__label">Access requested</legend>
            <div class="options">
              <label class="option">
                <input class="check" type="checkbox" name="scope" value="openid" checked>
                <span>
                  <span class="option__name">Confirm who you are</span>
                  <span class="option__value">openid<span class="tag">Allowed before</span></span>
                </span>
              </label>
              <label class="option">
                <input class="check" type="checkbox" name="scope" value="profile" checked>
                <span>
                  <span class="option__name">Read your name and profile</span>
                  <span class="option__value">profile<span class="tag">Allowed before</span></span>
                </span>
              </label>
              <label class="option">
                <input class="check" type="checkbox" name="scope" value="email" checked>
                <span>
                  <span class="option__name">Read your email address</span>
                  <span class="option__value">email</span>
                </span>
              </label>
              <label class="option">
                <input class="check" type="checkbox" name="scope" value="orders.read" checked>
                <span>
                  <span class="option__name">Read your orders</span>
                  <span class="option__value">orders.read</span>
                </span>
              </label>
              <label class="option">
                <input class="check" type="checkbox" name="scope" value="offline_access" checked>
                <span>
                  <span class="option__name">Keep this access while you are away</span>
                  <span class="option__value">offline_access</span>
                </span>
              </label>
            </div>
          </fieldset>

          <div class="auth__actions">
            <button class="key key--lg" id="consent-deny" name="action" value="deny" type="submit">Deny</button>
            <button class="key key--primary key--lg" id="consent-allow" name="action" value="allow" type="submit">Allow</button>
          </div>
        </form>
      </section>
    </div>

    <footer class="auth__foot">
      <p class="auth__secured">
        <svg class="logo logo--mark logo--quiet" viewBox="0 0 64 64" aria-hidden="true"><use href="#logo-identity-mark"/></svg>
        Secured by NCode Identity
      </p>
      <p class="auth__links">
        <a class="link link--quiet" href="#privacy">Privacy</a>
        <a class="link link--quiet" href="#terms">Terms</a>
      </p>
    </footer>

  </div>
</main>
