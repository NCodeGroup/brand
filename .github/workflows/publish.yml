# Publish release archive: when a GitHub release is published, or when the Tag and publish release workflow
# (tag-release.yml) starts it for the release it published, packs the tagged commit's released files into
# brand-<version>.tar.gz, signs a build provenance attestation for it, and attaches the archive and the attestation's
# bundle, <tag>.intoto.jsonl, to the release. vendoring/vendor-brand.mjs verifies that attestation before it writes a
# file; docs/decisions/1009-a-release-carries-an-attested-archive-and-vendor-brand-verifies-it-before-writing.md says why.
#
# Two jobs, so the job that runs the repository's code holds no write permission:
#   - pack checks the tag is a version (v1.2.3) and names a commit the default branch holds, so a tag on an unreviewed
#     commit publishes nothing; then node build.mjs --archive checks every generated file and packs the archive;
#   - attach runs in the release environment, which admits only tags v* and waits for a maintainer's approval, then
#     attests the archive pack uploaded, verifies the attestation as vendor-brand.mjs does, and attaches the archive
#     and the bundle to the release.
#
# A release made with a workflow's GITHUB_TOKEN, as tag-release.yml makes it, starts no workflow, so
# .template/Publish-Release.ps1 starts this one through workflow_dispatch, on the tag and with the tag as input. To
# attach a release's archive by hand: Actions > Publish release archive > Run workflow, choosing the tag under Use
# workflow from and entering it as the input: a run from a branch is refused by the release environment.
# A rerun packs the archive again and replaces the assets. The project owns this file: template updates never change it.
name: Publish release archive

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, such as v1.2.3
        required: true
        type: string

permissions: {}

# One publication at a time; a second waits rather than racing the first to the release's assets.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Read the version from the tag
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "The release tag '$env:TAG' isn't a version such as v1.2.3." }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          "tag=$env:TAG" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tagged commit, which a run started by hand names with its tag input.
          ref: refs/tags/${{ steps.version.outputs.tag }}
          # Every branch's history, for the check below.
          fetch-depth: 0
          persist-credentials: false
      # Only reviewed code is released: the tag must name a commit the default branch already holds.
      - name: Check the tagged commit is on the default branch
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor HEAD "origin/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -eq 1) { throw "The release tag names a commit that isn't on $env:DEFAULT_BRANCH: tag a commit that is." }
          if ($LASTEXITCODE) { throw "git merge-base failed with exit code $LASTEXITCODE." }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Pack the archive
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node build.mjs --archive dist
          if ($LASTEXITCODE) { throw "node build.mjs --archive failed with exit code ${LASTEXITCODE}: a generated file is stale." }
          if (-not (Test-Path -LiteralPath "dist/brand-$env:VERSION.tar.gz")) { throw "package.json's version at the tag isn't $env:VERSION, the tag's." }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive
          path: dist/brand-${{ steps.version.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  attach:
    name: Attest and attach
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Settings > Environments > release requires a maintainer's approval and admits only tags v*.
    environment: release
    permissions:
      # To store the attestation with the repository.
      attestations: write
      # To upload the archive and the bundle to the release.
      contents: write
      # To sign the attestation with the job's OIDC token.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: dist/brand-${{ needs.pack.outputs.version }}.tar.gz
      # The same check vendor-brand.mjs runs, so a broken signing step fails here, not for a consumer.
      - name: Verify the attestation as vendor-brand.mjs does
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.pack.outputs.tag }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          gh attestation verify "dist/brand-$env:VERSION.tar.gz" --repo $env:GH_REPO --signer-workflow "$env:GH_REPO/.github/workflows/publish.yml" --source-ref "refs/tags/$env:TAG" --deny-self-hosted-runners
          if ($LASTEXITCODE) { throw "gh attestation verify failed with exit code $LASTEXITCODE." }
      - name: Attach the archive and its attestation to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.pack.outputs.tag }}
          VERSION: ${{ needs.pack.outputs.version }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          Copy-Item -LiteralPath $env:BUNDLE -Destination "$env:TAG.intoto.jsonl"
          gh release upload $env:TAG "dist/brand-$env:VERSION.tar.gz" "$env:TAG.intoto.jsonl" --clobber
          if ($LASTEXITCODE) { throw "gh release upload failed with exit code $LASTEXITCODE." }
