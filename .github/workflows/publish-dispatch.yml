# Start release archive publication: starts publish.yml on the release tag that the Tag and publish release workflow
# (tag-release.yml) made. A tag pushed with GITHUB_TOKEN starts no workflow, and release: tag makes the template's script
# publish nothing, so this workflow, which a workflow_run of the tagging workflow starts, dispatches publish.yml.
# publish.yml runs on the tag, so its attestation names refs/tags/<tag>, as vendoring/vendor-brand.mjs requires.
# It reads the tags through the API and checks out no code, so the privileged run never executes the tagged commit.
# The project owns this file: template updates never change it.
name: Start release archive publication

on:
  workflow_run:
    workflows: [Tag and publish release]
    types: [completed]

permissions: {}

concurrency:
  group: publish-dispatch-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # To read the repository's tags.
      contents: read
      # To start publish.yml.
      actions: write
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Start publish.yml on each release tag at the commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $names = @(gh api --paginate "repos/$env:GH_REPO/tags?per_page=100" --jq '.[] | select(.commit.sha == env.HEAD_SHA) | .name')
          if ($LASTEXITCODE) { throw "gh api failed with exit code $LASTEXITCODE." }
          $tags = @($names | Where-Object { $_ -cmatch '^v[0-9]+\.[0-9]+\.[0-9]+\z' })
          if ($tags.Count -eq 0) {
            'No release tag names this commit: nothing to publish.'
            exit 0
          }
          foreach ($tag in $tags) {
            gh workflow run publish.yml --ref $tag --field "tag=$tag"
            if ($LASTEXITCODE) { throw "gh workflow run failed with exit code $LASTEXITCODE for $tag." }
          }
